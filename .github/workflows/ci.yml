name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            spacetimedb/package-lock.json
      - run: npm ci
      - run: npm ci --prefix spacetimedb
      - run: npm run typecheck
      - run: npm run check --prefix spacetimedb
      - run: npm test
      - run: npm run build
